openapi: 3.0.3
info:
  title: Pet API
  version: 1.0.0
servers:
  - url: https://pets.example.invalid
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
  schemas:
    Pet:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
security:
  - token: []
paths:
  /pets/{pet_id}:
    get:
      operationId: get_pet
      summary: Retrieve a pet
      parameters:
        - name: pet_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found

# Jira Cloud REST API v3. Set JIRA_BASE_URL to https://SITE.atlassian.net. See examples/README.md.
# Generate: uvx codapact generate   (writes ./generated)
# Run:      uvx --from ./generated codapact-jira doctor
version: 1
source:
  type: openapi
  path: https://developer.atlassian.com/cloud/jira/platform/swagger-v3.v3.json
  options: {strict: false}
shape:
  - group: {by: tag}
cli:
  env_prefix: JIRA
  auth:
    basicAuth:
      docs: "Username is your Atlassian account email. Password is an API token from https://id.atlassian.com/manage-profile/security/api-tokens"
      check: getCurrentUser
targets:
  - {name: python, output: generated, options: {package: codapact_jira, distribution: codapact-jira}}
  - {name: python-cli, output: generated}

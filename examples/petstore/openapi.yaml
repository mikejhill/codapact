openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
  description: A small pet store used by Codapact examples and tests.
servers:
  - url: https://petstore.example.com/v1
security:
  - token: []
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
  schemas:
    Pet:
      type: object
      required: [id, name, status]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, minLength: 1}
        status: {$ref: '#/components/schemas/PetStatus'}
        tag: {type: [string, "null"]}
        owner: {$ref: '#/components/schemas/Owner'}
        friends:
          type: array
          items: {$ref: '#/components/schemas/Pet'}
    PetStatus:
      type: string
      enum: [available, pending, sold]
    Owner:
      type: object
      required: [name]
      properties:
        name: {type: string}
        contactEmail: {type: string, format: email}
    NewPet:
      type: object
      required: [name]
      properties:
        name: {type: string}
        tag: {type: string}
        status: {$ref: '#/components/schemas/PetStatus'}
    PetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Pet'}
        next_cursor: {type: [string, "null"]}
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string}
    Animal:
      oneOf:
        - $ref: '#/components/schemas/Pet'
        - $ref: '#/components/schemas/Owner'
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List pets
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: array, items: {$ref: '#/components/schemas/PetStatus'}}}
      responses:
        '200':
          description: A page of pets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PetPage'}
    post:
      operationId: createPet
      tags: [pets]
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPet'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
        '422':
          description: Invalid pet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /pets/{petId}:
    parameters:
      - {name: petId, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getPet
      tags: [pets]
      summary: Get a pet
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deletePet
      tags: [pets]
      summary: Delete a pet
      responses:
        '204': {description: Deleted}
  /health:
    get:
      operationId: health
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}

# Every parameter placement and serialization style codapact supports, for
# cross-target parity tests: Python and TypeScript must put identical bytes on the wire.
openapi: 3.1.0
info: {title: Wire, version: "1"}
servers: [{url: "https://wire.example.com"}]
paths:
  /echo/{ids}/{name}:
    parameters:
      - {name: ids, in: path, required: true, schema: {type: array, items: {type: integer}}}
      - {name: name, in: path, required: true, schema: {type: string}}
    post:
      operationId: echo
      parameters:
        - {name: tag, in: query, schema: {type: array, items: {type: string}}}
        - {name: csv, in: query, explode: false, schema: {type: array, items: {type: string}}}
        - {name: flag, in: query, schema: {type: boolean}}
        - {name: X-Trace, in: header, schema: {type: string}}
        - {name: X-Langs, in: header, schema: {type: array, items: {type: string}}}
        - {name: sid, in: cookie, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                camelCase: {type: string}
                note: {type: [string, "null"]}
      responses:
        "200":
          description: echo
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /touch:
    patch:
      operationId: touch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string}
      responses:
        "200":
          description: echo
          content:
            application/json:
              schema: {type: object, additionalProperties: true}

name: Mutation
# Mutation testing measures whether the tests notice behavior changes. It is slow,
# so it runs after merges to main, weekly, and on demand; it never gates a PR.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MUTATION_FLOOR: '80'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --locked --group mutation
      - name: Run mutmut
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 80m uv run mutmut run --max-children 4
          echo "run_exit=$?" >> "$GITHUB_ENV"
          uv run mutmut export-cicd-stats
          mkdir -p mutation-report
          uv run mutmut results > mutation-report/survivors.txt
      - name: Enforce mutation score floor
        run: |
          test "$run_exit" = 0 || { echo "mutmut did not finish (exit $run_exit)"; exit 1; }
          cp mutants/mutmut-cicd-stats.json mutation-report/
          uv run poe mutation-score
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: mutation-report/
          if-no-files-found: warn
          retention-days: 30

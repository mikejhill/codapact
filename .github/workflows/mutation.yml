name: Mutation
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutation-main
  cancel-in-progress: false
jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-default manual refs
        run: test "$GITHUB_REF" = refs/heads/main
  scan:
    needs: validate-ref
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --locked --group mutation
      - name: Run bounded asynchronous mutation analysis
        run: |
          mkdir -p mutation-report
          set +e
          timeout --signal=TERM --kill-after=10s 18m uv run --group mutation mutmut run --max-children 2 > mutation-report/run.log 2>&1
          code=$?
          uv run --group mutation mutmut export-cicd-stats >> mutation-report/run.log 2>&1
          uv run --group mutation mutmut results --all true > mutation-report/results.txt 2>&1
          results_code=$?
          tar -czf mutation-report/mutants.tar.gz -C mutants/src codapact
          archive_code=$?
          if test "$code" -eq 0 && { test "$results_code" -ne 0 || test "$archive_code" -ne 0; }; then
            code=1
          fi
          uv run python scripts/mutation_report.py --exit-code "$code" --stats mutants/mutmut-cicd-stats.json --output mutation-report/report.json
      - name: Preserve evidence on failure or incomplete run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: mutation-report/
          if-no-files-found: warn
          retention-days: 30

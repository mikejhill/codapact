name: Mutation
# Mutation testing measures whether the tests notice behavior changes. It is slow
# (~9k mutants), so it runs in parallel shards after merges to main, weekly, and on
# demand; it never gates a PR. Each shard must finish and meet the score floor.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mutmut:
    name: mutmut ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {name: openapi, patterns: 'codapact.sources.openapi.*'}
          - {name: sources, patterns: 'codapact.sources.graphql.* codapact.sources.loader.* codapact.sources.base.*'}
          - {name: targets, patterns: 'codapact.targets.*'}
          - {name: runtime, patterns: 'codapact.runtime.*'}
          - {name: pipeline, patterns: 'codapact.pipeline.* codapact.plugins.* codapact.commands.*'}
          - {name: model, patterns: 'codapact.model.* codapact.shaping.* codapact.surface.* codapact.core.*'}
    env:
      # Baseline 2026-11-11: ~74% overall. Raise as survivors are fixed; never lower.
      MUTATION_FLOOR: '70'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --locked --group mutation
      - name: Run mutmut
        env:
          PATTERNS: ${{ matrix.shard.patterns }}
        run: |
          set +e
          read -ra patterns <<< "$PATTERNS"
          timeout --signal=TERM --kill-after=30s 65m uv run mutmut run --max-children 4 "${patterns[@]}"
          echo "run_exit=$?" >> "$GITHUB_ENV"
          mkdir -p mutation-report
          uv run mutmut results --all true > mutation-report/results.txt
      - name: Enforce mutation score floor
        env:
          PATTERNS: ${{ matrix.shard.patterns }}
        run: |
          test "$run_exit" = 0 || { echo "mutmut did not finish (exit $run_exit)"; exit 1; }
          args=()
          for pattern in $PATTERNS; do args+=(--prefix "${pattern%\*}"); done
          uv run python scripts/mutation_score.py --results mutation-report/results.txt "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.shard.name }}
          path: mutation-report/
          if-no-files-found: warn
          retention-days: 30
